name: Build WinUI 3 .NET 10

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: |
        dotnet build -c Release /p:Platform=x64
