version: 2
updates:
  # 1. GitHub Actions: обновляются автоматически по понедельникам
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"

  # 2. NuGet (.NET): автоматические PR отключены
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
